plugins {
    id 'com.android.application'
}

android {
    namespace 'app.hannaada.usbprobe'
    compileSdk 33

    defaultConfig {
        applicationId 'app.hannaada.usbprobe'
        minSdk 21
        targetSdk 28
        versionCode 2
        versionName '0.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
