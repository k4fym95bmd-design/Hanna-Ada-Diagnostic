plugins {
    id 'com.android.application'
}

android {
    namespace 'app.hannaada.usbprobe'
    compileSdk 33

    defaultConfig {
        applicationId 'app.hannaada.usbprobe'
        minSdk 21
        targetSdk 28
        versionCode 4
        versionName '0.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Java USB-host driver; does not depend on root, INPA or a Windows computer.
    implementation 'com.github.mik3y:usb-serial-for-android:3.9.0'
}
