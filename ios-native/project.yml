name: HannaAdaDiag
options:
  bundleIdPrefix: app.hannaada
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  HannaAdaDiag:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hannaada.diagpro
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Hanna & Ada"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Hanna & Ada uses Bluetooth to connect to your authorized OBD diagnostic adapter."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
  HannaAdaDiagTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: HannaAdaDiag
schemes:
  HannaAdaDiag:
    build:
      targets:
        HannaAdaDiag: all
        HannaAdaDiagTests: [test]
    test:
      targets:
        - HannaAdaDiagTests
