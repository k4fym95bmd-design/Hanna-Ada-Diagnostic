name: CI

on:
  push:
    branches: [main, "hardening/**", "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: JavaScript smoke and gateway tests
        run: npm test
      - name: BMW DS2/KWP codec and USB serial transport tests (offline fake hardware)
        run: python3 -m unittest discover -s test -p 'test_*.py' -v
