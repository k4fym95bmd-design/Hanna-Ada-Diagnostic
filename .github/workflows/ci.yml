# IMPORTANT: while PR #35 remains DRAFT and GitHub-hosted runner entitlement is blocked,
# keep the job-level draft guard below. Removing it causes repeated pre-run failures
# (runner_id=0, steps=[]) and burns Actions attempts without executing code.
# Only remove the guard after a controlled manual probe receives a real runner.

name: CI

on:
  push:
    branches: [main, "hardening/**", "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Smoke test
        run: npm test
