name: Deploy Hanna & Ada to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETLIFY_SITE_ID: 5eec6c26-090e-4e0c-8a05-d8518bcc0995
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify site files and gateway tests
        run: |
          test -f public/index.html
          test -f netlify.toml
          npm test
      - name: Verify Netlify authorization is configured
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error title=Netlify credential missing::Add NETLIFY_AUTH_TOKEN as a GitHub Actions repository secret under Settings > Secrets and variables > Actions. Do not paste it into code or a workflow file."
            exit 1
          fi
      - name: Deploy static site to existing Netlify project
        run: >-
          npx --yes netlify-cli@latest deploy
          --prod
          --no-build
          --dir=public
          --site="$NETLIFY_SITE_ID"
          --message="GitHub ${GITHUB_SHA}"
