# One-time handoff: only the verified, read-only USB test APK is public.
# Repo, source, build logs and credentials remain private.
name: One-time Android 5 USB test public download
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/usb-probe-public-link.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  share-verified-usb-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch and verify Android 5 v0.3 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p apk
          gh run download 35587938365 --repo "$GITHUB_REPOSITORY" --name hanna-ada-android5-usb-probe-debug --dir apk
          test -s apk/app-debug.apk
          echo 'b41c2bad31933c3eee946d390fd8c0b14165c20aaa3ad483789a4320daf56cf2  apk/app-debug.apk' | sha256sum --check
          cp apk/app-debug.apk HannaAda-USB-Test-v0.3.apk
      - name: Publish only APK and verify public download byte for byte
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 2 --max-time 75 \
            -F 'files=@HannaAda-USB-Test-v0.3.apk;type=application/vnd.android.package-archive' \
            -F expiryHours=48 'https://tempfile.org/api/upload/local')"
          printf '%s' "$response" > "$RUNNER_TEMP/upload.json"
          url="$(python3 - "$RUNNER_TEMP/upload.json" <<'PY'
          import json,re,sys
          d=json.load(open(sys.argv[1]))
          if d.get('success') is not True or len(d.get('files', []))!=1:
              raise SystemExit('Upload failed')
          f=d['files'][0]
          if f.get('size') != 16452:
              raise SystemExit('Upload size mismatch')
          file_id=f.get('id','')
          if not isinstance(file_id,str) or not re.fullmatch(r'[A-Za-z0-9_-]{6,64}',file_id):
              raise SystemExit('Invalid file ID')
          print('https://tempfile.org/'+file_id+'/download')
          PY
          )"
          curl --fail --silent --show-error --location --retry 2 --max-time 75 "$url" -o "$RUNNER_TEMP/verified.apk"
          cmp HannaAda-USB-Test-v0.3.apk "$RUNNER_TEMP/verified.apk"
          printf 'PUBLIC_APK_DOWNLOAD=%s\n' "$url"
          { echo '### Public verified USB Test v0.3 APK link (48 h, no login)'; echo; echo "$url"; echo; echo 'SHA-256: `b41c2bad31933c3eee946d390fd8c0b14165c20aaa3ad483789a4320daf56cf2`'; } >> "$GITHUB_STEP_SUMMARY"
