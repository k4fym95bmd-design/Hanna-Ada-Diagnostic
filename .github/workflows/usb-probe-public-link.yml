# One-time handoff of the owner's already-built, read-only USB test APK. No repo files published.
name: One-time Android 5 USB test public download
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/usb-probe-public-link.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  share-verified-usb-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch and verify original Android 5 v0.2 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p apk
          gh run download 35583500629 --repo "$GITHUB_REPOSITORY" --name hanna-ada-android5-usb-probe-debug --dir apk
          test -s apk/app-debug.apk
          echo '2ae182d7e4e403951c46ff588409b89ec9a7474842bc7b752a3c5c23567e038d  apk/app-debug.apk' | sha256sum --check
          cp apk/app-debug.apk HannaAda-USB-Test-v0.2.apk
      - name: Publish only APK and verify public download byte for byte
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 2 --max-time 75 \
            -F 'files=@HannaAda-USB-Test-v0.2.apk;type=application/vnd.android.package-archive' \
            -F expiryHours=48 'https://tempfile.org/api/upload/local')"
          printf '%s' "$response" > "$RUNNER_TEMP/upload.json"
          url="$(python3 - "$RUNNER_TEMP/upload.json" <<'PY'
          import json,re,sys
          d=json.load(open(sys.argv[1]))
          if d.get('success') is not True or len(d.get('files', []))!=1:
              raise SystemExit('Upload failed')
          f=d['files'][0]
          if f.get('size') != 15653:
              raise SystemExit('Upload size mismatch')
          file_id=f.get('id','')
          if not isinstance(file_id,str) or not re.fullmatch(r'[A-Za-z0-9_-]{6,64}',file_id):
              raise SystemExit('Invalid file ID')
          print('https://tempfile.org/'+file_id+'/download')
          PY
          )"
          curl --fail --silent --show-error --location --retry 2 --max-time 75 "$url" -o "$RUNNER_TEMP/verified.apk"
          cmp HannaAda-USB-Test-v0.2.apk "$RUNNER_TEMP/verified.apk"
          printf 'PUBLIC_APK_DOWNLOAD=%s\n' "$url"
          { echo '### Public verified APK link (48 h, no login)'; echo; echo "$url"; echo; echo 'SHA-256: `2ae182d7e4e403951c46ff588409b89ec9a7474842bc7b752a3c5c23567e038d`'; } >> "$GITHUB_STEP_SUMMARY"
