name: Android 5 USB capability probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'android-usb-probe/**'
      - '.github/workflows/android-usb-probe.yml'
  push:
    branches: [main]
    paths:
      - 'android-usb-probe/**'
      - '.github/workflows/android-usb-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-offline-probe:
    name: Build API 21 offline USB inspector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test sanitized USB report and next-step logic (offline JDK)
        run: |
          mkdir -p "$RUNNER_TEMP/usb-report-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/usb-report-tests" \
            android-usb-probe/app/src/main/java/app/hannaada/usbprobe/UsbReport.java \
            android-usb-probe/app/src/main/java/app/hannaada/usbprobe/UsbReadiness.java \
            android-usb-probe/app/src/test/java/app/hannaada/usbprobe/UsbReportTest.java
          java -cp "$RUNNER_TEMP/usb-report-tests" app.hannaada.usbprobe.UsbReportTest
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android API 33 SDK
        run: sdkmanager 'platforms;android-33' 'build-tools;33.0.2'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
      - name: Compile debug-only offline probe
        working-directory: android-usb-probe
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: hanna-ada-android5-usb-probe-debug
          path: android-usb-probe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
